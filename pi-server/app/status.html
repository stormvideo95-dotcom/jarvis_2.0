<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jarvis 2.0</title>
<style>
  :root { --bg:#0b0d12; --card:#151924; --line:#262c3b; --text:#e8ebf2; --muted:#8b93a7; --accent:#ffb020; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background:var(--bg); color:var(--text); }
  main { max-width: 640px; margin: 0 auto; padding: 32px 18px; }
  .orb { width:72px; height:72px; border-radius:50%; border:3px solid var(--accent); display:grid; place-items:center; margin-bottom:14px; }
  .orb span { width:28px; height:28px; border-radius:50%; background:var(--accent); }
  h1 { margin:0 0 4px; font-size:26px; font-weight:600; }
  .sub { color:var(--muted); margin:0 0 22px; }
  .pills { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:22px; }
  .pill { background:var(--card); border:1px solid var(--line); border-radius:999px; padding:6px 12px; font-size:13px; color:var(--muted); }
  .pill b { color:var(--text); font-weight:500; }
  form { display:flex; gap:8px; margin-bottom:24px; }
  input { flex:1; background:var(--card); border:1px solid var(--line); color:var(--text); border-radius:12px; padding:12px 14px; font-size:15px; }
  button { background:var(--accent); color:#1b1200; border:0; border-radius:12px; padding:0 18px; font-weight:600; font-size:15px; cursor:pointer; }
  .item { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:12px 14px; margin-bottom:10px; }
  .item .t { color:var(--muted); font-size:12px; }
  .item .h { margin:4px 0 2px; }
  .item .s { color:var(--accent); }
  .empty { color:var(--muted); }
  .card { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:16px; margin-bottom:24px; }
  .card h2 { font-size:15px; margin:0 0 12px; font-weight:600; }
  .seg { display:flex; background:#0f1219; border:1px solid var(--line); border-radius:12px; padding:3px; margin-bottom:14px; }
  .seg button { flex:1; background:transparent; color:var(--muted); border-radius:9px; padding:10px; font-weight:500; }
  .seg button.on { background:var(--accent); color:#1b1200; font-weight:600; }
  .row { display:flex; gap:10px; align-items:center; margin-top:10px; color:var(--muted); font-size:14px; }
  .row select { flex:1; background:#0f1219; border:1px solid var(--line); color:var(--text); border-radius:10px; padding:10px; font-size:15px; }
  .row input[type=range] { flex:1; accent-color: var(--accent); }
  .hint { color:var(--muted); font-size:13px; margin:10px 0 0; }
</style>
</head>
<body>
<main>
  <div class="orb"><span></span></div>
  <h1>Jarvis 2.0</h1>
  <p class="sub">Hou BOOT op je ronde board ingedrukt en praat. Of typ hieronder.</p>
  <div class="pills" id="pills"><span class="pill">laden…</span></div>
  <div class="card" id="musiccode" style="display:none"></div>
  <div class="card" id="guardcard">
    <h2>TimeGuard · social media</h2>
    <div style="height:10px;background:#0f1219;border-radius:99px;overflow:hidden"><span id="gbar" style="display:block;height:100%;width:0;background:var(--accent)"></span></div>
    <p class="hint" id="gtext">…</p>
    <div class="row">Daglimiet <input id="glimit" type="range" min="15" max="300" step="15"><span id="glimitv"></span></div>
    <div class="row"><button type="button" id="glock" style="padding:10px 14px">Alles op slot</button>
      <button type="button" id="gonoff" style="padding:10px 14px;background:#262c3b;color:var(--text)">TimeGuard uit</button></div>
    <p class="hint">Openen gaat alleen via Jarvis: "Jarvis, unlock WhatsApp 15 minuten".</p>
  </div>
  <div class="card">
    <h2>Hoe start je Jarvis?</h2>
    <div class="seg"><button id="m-button" type="button">Knop (BOOT)</button><button id="m-wake" type="button">Wake word</button></div>
    <div id="wakebox">
      <div class="row">Wake word <select id="ww"></select></div>
      <div class="row">Gevoeligheid <input id="sens" type="range" min="0.2" max="0.9" step="0.05"><span id="sensv"></span></div>
      <p class="hint" id="wakehint"></p>
    </div>
    <p class="hint" id="btnhint">Hou BOOT ingedrukt, praat, laat los.</p>
  </div>
  <form id="f"><input id="q" placeholder="Zeg iets tegen Jarvis…" autocomplete="off"><button>Stuur</button></form>
  <div id="list"></div>
  <h3 style="margin:26px 0 8px;font-size:15px;color:var(--muted);font-weight:500">Board-log</h3>
  <div id="blog" style="font-family:ui-monospace,monospace;font-size:12px;color:var(--muted);line-height:1.7"></div>
</main>
<script>
const key = () => { try { return localStorage.getItem('jarvisKey') || ''; } catch { return ''; } };
async function api(path, opts = {}) {
  opts.headers = Object.assign({ 'X-Jarvis-Key': key(), 'Content-Type': 'application/json' }, opts.headers || {});
  const r = await fetch(path, opts);
  if (r.status === 401) {
    const k = prompt('Jarvis key (JARVIS_KEY uit je .env):');
    if (k) { try { localStorage.setItem('jarvisKey', k); } catch {} return api(path, opts); }
  }
  return r.json();
}
function esc(s) { return String(s || '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
async function load() {
  const h = await api('/api/health');
  document.getElementById('pills').innerHTML =
    `<span class="pill">NVIDIA <b>${h.nvidia_key ? 'verbonden' : 'geen key'}</b></span>` +
    `<span class="pill">Model <b>${esc(h.model)}</b></span>` +
    `<span class="pill">Taal <b>${esc(h.language)}</b></span>` +
    `<span class="pill">Speaker <b>${esc(h.nest)}</b></span>` +
    `<span class="pill">Home Assistant <b>${esc(h.home_assistant)}</b></span>` +
    `<span class="pill">Music AI <b>${h.music_ai.paired ? 'gekoppeld' : (h.music_ai.code ? 'code ' + esc(h.music_ai.code) : esc(h.music_ai.error || 'koppelen…'))}</b></span>`;
  if (h.study) document.getElementById('pills').innerHTML +=
    `<span class="pill" style="border-color:var(--accent)">Studeren <b>${esc(h.study.subject)} · ${esc(h.study.game || '…')} · ${h.study.correct}/${h.study.answered}</b></span>`;
  const ss = h.storm_study || {};
  document.getElementById('pills').innerHTML += `<span class="pill">Storm Study <b>${!ss.linked ? 'niet gekoppeld' :
     (ss.topics ? ss.topics + ' onderwerpen · ' + ss.mistakes + ' fouten' + (ss.points != null ? ' · ' + ss.points + ' pt' : '') : 'zeg "update study mode"')}${ss.queued ? ' · ' + ss.queued + ' in wachtrij' : ''}</b></span>`;
  const g = h.guard || {};
  if (g.limit_min !== undefined) {
    document.getElementById('gbar').style.width = Math.max(0, 100 * g.remaining_min / Math.max(1, g.limit_min)) + '%';
    const open = Object.entries(g.grants || {}).map(([a, u]) => `${a} ${Math.max(0, Math.round((u - g.now) / 60))} min`);
    const dev = Object.entries(g.devices || {}).map(([d, s]) => `${d} ${s < 90 ? '✓' : 'offline'}`);
    document.getElementById('gtext').textContent = g.enabled
      ? `Nog ${Math.round(g.remaining_min)} van ${g.limit_min} min · open: ${open.join(', ') || 'niets'} · toestellen: ${dev.join(', ') || 'nog geen'}`
      : 'TimeGuard staat uit: alles is open.';
    if (document.activeElement !== document.getElementById('glimit')) document.getElementById('glimit').value = g.limit_min;
    document.getElementById('glimitv').textContent = g.limit_min + ' min';
    document.getElementById('gonoff').textContent = g.enabled ? 'TimeGuard uit' : 'TimeGuard aan';
    document.getElementById('gonoff').dataset.on = g.enabled ? '1' : '';
  }
  const mc = document.getElementById('musiccode');
  if (h.music_ai.code && !h.music_ai.paired) {
    mc.style.display = '';
    mc.innerHTML = `<h2>Koppel Jarvis aan Music AI</h2><div style="font-size:34px;letter-spacing:6px;font-weight:700;color:var(--accent)">${esc(h.music_ai.code)}</div>
      <p class="hint">Open Music AI op je gsm → Instellingen → Taste AI → <b>Add a device</b> en typ deze code. Daarna staat "Jarvis (Nest)" in je Play on-lijst.</p>`;
  } else { mc.style.display = 'none'; }
  const b = await api('/api/board');
  document.getElementById('pills').innerHTML +=
    `<span class="pill">Board <b>${b.last_seen ? 'gezien ' + esc(b.last_seen) : 'nog niet gezien'}</b>${b.rssi ? ' · wifi ' + esc(b.rssi) + ' dBm' : ''}</span>`;
  document.getElementById('blog').innerHTML = (b.log || []).slice(0, 8).map(l => `<div>${esc(l)}</div>`).join('') || '<div>Nog geen board-log.</div>';
  const items = await api('/api/history');
  document.getElementById('list').innerHTML = items.length ? items.map(i =>
    `<div class="item"><div class="t">${esc(i.time)}${i.action ? ' · ' + esc(i.action) : ''}</div>
     <div class="h">${esc(i.heard)}</div><div class="s">${esc(i.said)}</div></div>`).join('')
    : '<p class="empty">Nog niets gezegd.</p>';
}
document.getElementById('f').onsubmit = async e => {
  e.preventDefault();
  const q = document.getElementById('q'); if (!q.value.trim()) return;
  const text = q.value; q.value = '';
  await api('/api/text', { method: 'POST', body: JSON.stringify({ text }) });
  load();
};
let S = null;
async function loadSettings() {
  S = await api('/api/settings');
  document.getElementById('ww').innerHTML = Object.entries(S.wake_words)
    .map(([k, v]) => `<option value="${k}" ${k === S.wake_word ? 'selected' : ''}>${esc(v)}</option>`).join('');
  document.getElementById('sens').value = S.sensitivity;
  paint();
}
function paint() {
  const wakeOn = S.mode === 'wake';
  document.getElementById('m-button').classList.toggle('on', !wakeOn);
  document.getElementById('m-wake').classList.toggle('on', wakeOn);
  document.getElementById('wakebox').style.display = wakeOn ? '' : 'none';
  document.getElementById('btnhint').style.display = wakeOn ? 'none' : '';
  document.getElementById('sensv').textContent = Number(S.sensitivity).toFixed(2);
}
async function save(changes) {
  S = await api('/api/settings', { method: 'POST', body: JSON.stringify(changes) });
  paint();
}
document.getElementById('m-button').onclick = () => save({ mode: 'button' });
document.getElementById('m-wake').onclick = () => save({ mode: 'wake' });
document.getElementById('ww').onchange = e => save({ wake_word: e.target.value });
document.getElementById('sens').onchange = e => save({ sensitivity: e.target.value });
document.getElementById('sens').oninput = e => { document.getElementById('sensv').textContent = Number(e.target.value).toFixed(2); };
async function wakeHint() {
  if (!S || S.mode !== 'wake') return;
  const b = await api('/api/board');
  const w = b.wake || {};
  document.getElementById('wakehint').textContent = w.streaming
    ? `Board luistert. Zeg "${S.wake_words[S.wake_word]}" en dan je vraag. (laatste score ${w.score})`
    : 'Wacht op het board… (het schakelt binnen 30 seconden om, of druk op RST)';
}
document.getElementById('glimit').onchange = e => api('/api/guard/settings', { method: 'POST', body: JSON.stringify({ limit_min: Number(e.target.value) }) }).then(load);
document.getElementById('glimit').oninput = e => { document.getElementById('glimitv').textContent = e.target.value + ' min'; };
document.getElementById('glock').onclick = () => api('/api/guard/lock', { method: 'POST' }).then(load);
document.getElementById('gonoff').onclick = e => api('/api/guard/settings', { method: 'POST', body: JSON.stringify({ enabled: !e.target.dataset.on }) }).then(load);
loadSettings(); load(); setInterval(() => { load(); wakeHint(); }, 4000);
</script>
</body>
</html>
