<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Op slot · TimeGuard</title>
<style>
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:#0b0d12; color:#e8ebf2;
         font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; text-align:center; }
  .lock { width:92px; height:92px; border-radius:50%; border:3px solid #ffb020; display:grid; place-items:center; margin:0 auto 22px; font-size:40px; }
  h1 { font-size:30px; margin:0 0 8px; font-weight:650; }
  p { color:#8b93a7; margin:6px 0; font-size:17px; }
  .say { margin-top:22px; display:inline-block; background:#151924; border:1px solid #262c3b; border-radius:14px; padding:14px 18px; color:#ffb020; font-size:18px; }
  .bar { width:300px; height:10px; background:#151924; border-radius:99px; margin:22px auto 6px; overflow:hidden; }
  .bar span { display:block; height:100%; background:#ffb020; }
</style>
</head>
<body>
<main>
  <div class="lock">🔒</div>
  <h1 id="t">Deze site staat op slot</h1>
  <p>TimeGuard houdt je social media in de hand.</p>
  <div class="bar"><span id="b" style="width:0"></span></div>
  <p id="left">…</p>
  <div class="say">Zeg: "Jarvis, mag ik <span id="n">dit</span> 15 minuten?"</div>
</main>
<script>
const q = new URLSearchParams(location.search), app = q.get('app') || '';
const names = {whatsapp:'WhatsApp', instagram:'Instagram', tiktok:'TikTok', snapchat:'Snapchat', youtube:'YouTube', reddit:'Reddit', x:'X', facebook:'Facebook'};
if (names[app]) { document.getElementById('t').textContent = names[app] + ' staat op slot'; document.getElementById('n').textContent = names[app]; }
fetch('/api/guard/public').then(r => r.json()).then(s => {
  document.getElementById('left').textContent = s.remaining_min > 0
    ? `Nog ${Math.round(s.remaining_min)} van je ${s.limit_min} minuten vandaag.` : 'Je tijd van vandaag is op. Morgen weer!';
  document.getElementById('b').style.width = Math.max(0, 100 * s.remaining_min / Math.max(1, s.limit_min)) + '%';
  if (s.open.includes(app) || s.open.includes('all')) { const back = q.get('back'); if (back) location.href = back; }
}).catch(() => { document.getElementById('left').textContent = 'Jarvis is niet bereikbaar.'; });
setTimeout(() => location.reload(), 15000);
</script>
</body>
</html>
