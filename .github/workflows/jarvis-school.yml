name: Jarvis School app

on:
  push:
    paths: ["school-android/**", ".github/workflows/jarvis-school.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.9" }
      - name: Build APK
        working-directory: school-android
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - run: cp school-android/app/build/outputs/apk/debug/app-debug.apk JarvisSchool.apk
      - uses: actions/upload-artifact@v4
        with: { name: JarvisSchool-apk, path: JarvisSchool.apk }
      - if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: jarvis-school
          name: Jarvis School (latest)
          make_latest: false
          body: |
            **Phone:** open this page on your Pixel, download JarvisSchool.apk and install it.
            Then ⚙ Instellen: Jarvis address + JARVIS_KEY.
          files: JarvisSchool.apk
